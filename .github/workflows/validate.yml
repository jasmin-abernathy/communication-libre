name: Validate infrastructure scaffold

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"

concurrency:
  group: communication-libre-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install linters only when missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          if ! command -v yamllint >/dev/null 2>&1; then
            python3 -m pip install --disable-pip-version-check 'yamllint>=1.35,<2'
          fi

      - name: Validate examples and scripts
        run: bash scripts/check-config.sh --examples-only
