name: communication-libre-tuwunel-cinny-lab

services:
  homeserver:
    image: ghcr.io/matrix-construct/tuwunel:v1.9.3
    restart: "no"
    stop_grace_period: 30m
    ports:
      - "${TUWUNEL_BIND:-127.0.0.1}:${TUWUNEL_HTTP_PORT:-8008}:6167"
    environment:
      TUWUNEL_SERVER_NAME: "${TUWUNEL_SERVER_NAME:-localhost}"
      TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
      TUWUNEL_PORT: "6167"
      TUWUNEL_ADDRESS: 0.0.0.0
      TUWUNEL_MAX_REQUEST_SIZE: "20000000"
      TUWUNEL_ALLOW_REGISTRATION: "true"
      TUWUNEL_REGISTRATION_TOKEN: "${TUWUNEL_REGISTRATION_TOKEN:-lab-only-change-me}"
      TUWUNEL_ALLOW_FEDERATION: "false"
      TUWUNEL_TRUSTED_SERVERS: '[]'
    volumes:
      - tuwunel-data:/var/lib/tuwunel

  cinny:
    image: ghcr.io/cinnyapp/cinny:v4.12.7
    restart: "no"
    depends_on:
      homeserver:
        condition: service_started
    ports:
      - "${CINNY_BIND:-127.0.0.1}:${CINNY_HTTP_PORT:-8080}:80"
    volumes:
      - ./cinny-config.json:/app/config.json:ro

volumes:
  tuwunel-data:
